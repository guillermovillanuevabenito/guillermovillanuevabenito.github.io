# Theme: Minimal Mistakes 4.26.2 (https://mmistakes.github.io/minimal-mistakes/), copied into this repo
minimal_mistakes_skin: "default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site settings
locale: "en-US"
title: "Guillermo Villanueva Benito"
name: "Guillermo Villanueva Benito"
description: "Personal website of Guillermo Villanueva Benito: publications, teaching and CV."
url: "https://guillermovillanuevabenito.com"
baseurl: ""
repository: "guillermovillanuevabenito/guillermovillanuevabenito.github.io"
og_image: "/assets/img/me.png"
search: false

# Site author
author:
  name: "Guillermo Villanueva Benito"
  avatar: "/assets/img/me.png"
  bio: "Applied mathematician and data scientist. Interested in data science, machine learning, operations research and optimization."
  location: "Barcelona, Spain"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:guillermovillanuevabenito@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/guillermovillanuevabenito"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/guillermo-villanueva-130691234/"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/guillermovillanuevabenito"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/guillermo-villanueva-130691234/"

# Reading files
include:
  - _pages
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - "*.code-workspace"
  - vendor

# Conversion
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Outputting
timezone: Europe/Madrid

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

# Defaults
defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      classes: wide # use the full width (no empty right column reserved for a TOC)
